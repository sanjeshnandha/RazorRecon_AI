<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Finance Controller</title>
<style>
/* ===========================================================================
   White + emerald. One accent colour, used only where it means something:
   emerald = reconciled / proven, amber = needs a human, red = unexplained.
   =========================================================================== */
:root{
  --em-50:#ecfdf5; --em-100:#d1fae5; --em-200:#a7f3d0; --em-300:#6ee7b7;
  --em-500:#10b981; --em-600:#059669; --em-700:#047857; --em-900:#064e3b;
  --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-4:#94a3b8;
  --line:#e2e8f0; --line-2:#f1f5f9; --bg:#ffffff; --bg-2:#f8fafc;
  --amber:#b45309; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --red:#b91c1c; --red-bg:#fef2f2; --red-line:#fecaca;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--em-700);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ---------- data browser ---------- */
.db-wrap{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.db-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;
  max-height:76vh;overflow-y:auto}
.db-group{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);
  padding:10px 12px 6px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.db-item{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
  padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--line-2);font-size:13px}
.db-item:hover{background:var(--em-50)}
.db-item.on{background:var(--em-50);color:var(--em-900);font-weight:600;
  box-shadow:inset 3px 0 0 var(--em-500)}
.db-item .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.db-item.on .n{color:var(--em-700)}
.db-item.zero{color:var(--ink-4)}
.db-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.db-head h4{margin:0;font-size:15px}
.db-head .meta{font-size:12px;color:var(--ink-3)}
.db-scroll{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:10px}
.db-scroll table{font-size:12px}
.db-scroll th{position:sticky;top:0;background:#fff;z-index:2;white-space:nowrap}
.db-scroll td{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.db-null{color:var(--ink-4);font-style:italic}
.db-pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-3)}
.db-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);cursor:pointer}

/* ---------- agent panel ---------- */
.ask-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:420px}
.ask-scroll{flex:1;overflow-y:auto;padding:4px 2px 12px}
.ask-turn{margin-bottom:22px}
.ask-q{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.ask-q .who{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--ink);
  color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.ask-q .txt{font-weight:600;padding-top:3px}
.ask-a{display:flex;gap:10px;align-items:flex-start}
.ask-a .who{flex:0 0 auto;width:24px;height:24px;border-radius:7px;
  background:linear-gradient(140deg,var(--em-500),var(--em-700));color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700}
.ask-a .body{flex:1;min-width:0}
.ask-a .body p{margin:0 0 10px}
.ask-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.ask-tool{font-family:var(--mono);font-size:11px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;color:var(--ink-3)}
.ask-cite{font-family:var(--mono);font-size:11px;background:var(--em-50);border:1px solid var(--em-200);
  border-radius:6px;padding:2px 7px;color:var(--em-700);cursor:pointer}
.ask-cite:hover{background:var(--em-100)}
.ask-warn{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red);
  border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px}
.ask-form{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ask-form input{flex:1}
.ask-seed{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.ask-seed button{text-align:left;font-size:12px;border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:8px 11px;cursor:pointer;color:var(--ink-2);max-width:100%}
.ask-seed button:hover{border-color:var(--em-300);background:var(--em-50);color:var(--em-900)}
.ask-note{font-size:12px;color:var(--ink-3);line-height:1.6}

/* ---------- chrome ---------- */
header.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,var(--em-500),var(--em-700));
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.spacer{flex:1}
select,input[type=text],input[type=search]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;
  background:#fff;color:var(--ink);font:inherit;outline:none}
select:focus,input:focus{border-color:var(--em-500);box-shadow:0 0 0 3px var(--em-100)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;
  color:var(--ink-2);font-weight:500;transition:.12s}
.btn:hover{border-color:var(--em-300);color:var(--em-700);background:var(--em-50)}
.btn.primary{background:var(--em-600);border-color:var(--em-600);color:#fff}
.btn.primary:hover{background:var(--em-700);border-color:var(--em-700);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--em-50);border-color:var(--em-300);color:var(--em-700);font-weight:600}
nav.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);background:#fff;
  overflow-x:auto}
nav.tabs button{border:0;background:none;padding:11px 14px;cursor:pointer;color:var(--ink-3);
  font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--em-700);border-bottom-color:var(--em-600)}

/* the disclaimer is not decoration -- it is on every screen, always */
/* Recommended action is engine prose in a dense figures table. One truncated
   line keeps every row the same height and the column edge straight; the full
   text is on the cell's title attribute, and in the settlement detail view. */
.clamp{color:var(--ink-2);font-size:12.5px;max-width:380px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.policy-chip{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;
  padding:3px 8px;cursor:default;white-space:nowrap}
.policy-chip:hover{border-color:var(--em-300);color:var(--em-700)}
main{padding:24px;max-width:1500px;margin:0 auto}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.card>h3{margin:0;padding:13px 16px;font-size:13px;font-weight:650;color:var(--ink-2);
  border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.card>h3 .sub{font-weight:400;color:var(--ink-4);font-size:12px}
.card .body{padding:16px}
.hero{border:1px solid var(--em-200);border-radius:14px;background:
  linear-gradient(160deg,var(--em-50),#fff 62%);padding:22px 24px}
.hero .label{font-size:12px;color:var(--em-700);font-weight:600;text-transform:uppercase;
  letter-spacing:.06em}
.hero .big{font-family:var(--mono);font-size:42px;font-weight:600;letter-spacing:-.02em;
  margin:6px 0 2px;color:var(--ink)}
.hero .big.risk{color:var(--red)}
.hero .note{color:var(--ink-3);font-size:12.5px;max-width:46ch}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.stat .k{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;
  letter-spacing:.05em}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.stat .d{font-size:12px;color:var(--ink-4);margin-top:2px}
.stat.good .v{color:var(--em-700)}
.stat.warn .v{color:var(--amber)}
.stat.bad  .v{color:var(--red)}
.meter{height:5px;border-radius:3px;background:var(--line-2);margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--em-500)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--bg-2);position:sticky;top:0}
td{padding:7px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:var(--em-50)}
tr.clickable{cursor:pointer}
tr.zebra:nth-child(even){background:#fcfdfe}
td.wrap,td .wrap{white-space:normal;min-width:220px}
.dcell{display:flex;gap:3px}
.legend{display:flex;gap:14px;align-items:center;margin-left:auto;font-size:11.5px;color:var(--ink-3)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
.chip.a{background:var(--em-50);border-color:var(--em-200);color:var(--em-700)}
.chip.b{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.chip.c{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.chip.n{background:var(--bg-2);border-color:var(--line);color:var(--ink-3)}
.dchip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:6px;
  font-size:11px;font-weight:600;font-family:var(--mono);border:1px solid;cursor:pointer}
.dchip.a{background:var(--em-50);border-color:var(--em-200);color:var(--em-700)}
.dchip.b{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.dchip.c{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--bg-2);
  border:1px solid var(--line);color:var(--ink-3);font-size:11px;font-family:var(--mono)}
.rule{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--em-50);
  border:1px solid var(--em-100);color:var(--em-700);font-size:10.5px;font-family:var(--mono);
  margin-right:4px}
.policy-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--em-700);
  background:var(--em-50);border:1px solid var(--em-100);border-radius:5px;padding:1px 5px;
  font-weight:600;white-space:nowrap}

/* ---------- explain panel ---------- */
.explain{font-family:var(--mono);font-size:12.5px;line-height:1.85}
.explain .row{display:flex;gap:12px;align-items:baseline}
.explain .row .l{flex:1;color:var(--ink-2)}
.explain .row .r{width:150px;text-align:right;font-variant-numeric:tabular-nums}
.explain .sep{border-top:1px dashed var(--line);margin:7px 0}
.explain .why{color:var(--ink-4);font-size:11.5px;padding-left:14px;line-height:1.6;
  font-family:inherit;white-space:normal}
.explain .tot{font-weight:650}
.explain .res.zero{color:var(--em-700)}
.explain .res.open{color:var(--red)}

/* ---------- trace ---------- */
.trace{font-family:var(--mono);font-size:12.5px}
.trace .node{padding:5px 0 5px 0;border-left:2px solid var(--em-100);margin-left:6px}
.trace .node .line{display:flex;gap:8px;align-items:baseline;padding-left:14px;position:relative}
.trace .node .line::before{content:"";position:absolute;left:-1px;top:11px;width:11px;height:2px;
  background:var(--em-100)}
.trace .kind{color:var(--em-700);font-weight:600}
.trace .id{color:var(--ink)}
.trace .meta{color:var(--ink-4);font-size:11.5px}
.trace .amt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.empty{padding:36px;text-align:center;color:var(--ink-4)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;
  border-bottom:1px solid var(--line-2);background:var(--bg-2)}
.filters label{font-size:12px;color:var(--ink-3);font-weight:500}
details.raw{margin-top:10px}
details.raw summary{cursor:pointer;color:var(--ink-3);font-size:12px}
pre{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:12px;
  overflow:auto;font-size:11.5px;max-height:340px}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--ink-3);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-family:var(--mono)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:11px 16px;
  border-radius:10px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(15,23,42,.2)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--em-200);
  border-top-color:var(--em-600);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><div class="mark">₹</div>
      <div>AI Finance Controller</div></div>
    <div class="spacer"></div>
    <span class="policy-chip" title="Demo Merchant Policy — not Razorpay's actual terms. Every fee, tax, settlement-cycle and bank-lag figure on this screen comes from a synthetic policy file authored for this project.">Demo policy</span>
    <label style="font-size:12px;color:var(--ink-3)">Run</label>
    <select id="runsel" style="min-width:300px"></select>
    <button class="btn" id="btn-generate">Generate dataset</button>
    <button class="btn" id="btn-tick" title="Append the next settlement cycle to this dataset and re-reconcile everything">Simulate next cycle</button>
    <button class="btn" id="btn-fixture" title="Load the fixed, hand-authored evaluation batch: same rows every time, every expected outcome stated in the file">Evaluation batch</button>
    <button class="btn primary" id="btn-run">Run reconciliation</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"><div class="empty"><span class="spin"></span> loading…</div></main>
<script>
/* ==========================================================================
   State + tiny render loop. No framework, no build step, no CDN -- the whole
   UI is this one file, so it runs offline next to the API.
   ========================================================================== */
const S = {tab:"dashboard", runs:[], run:null, metrics:null, settlements:[], exceptions:[],
           sellers:[], detail:null, sid:null, trace:null, traceQ:{type:"payment", id:""},
           filters:{status:"", tier:"", severity:"", kind:"", q:""}, busy:false, toast:null,
           agent:{status:null, turns:[], asking:false, draft:"", error:null},
           data:{tables:[], table:null, page:null, offset:0, raw:false, busy:false},
           forecast:null, fc:{horizon:15, busy:false}};

const $  = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...c)=>{const n=document.createElement(t);
  for(const[k,v]of Object.entries(a)){
    if(k==="class")n.className=v; else if(k==="html")n.innerHTML=v;
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==undefined)n.setAttribute(k,v);}
  for(const x of c.flat()){if(x===null||x===undefined||x===false)continue;
    n.appendChild(typeof x==="object"?x:document.createTextNode(String(x)));}
  return n;};

/* Money only ever becomes a string here, at the display boundary. */
function rupees(p){
  if(p===null||p===undefined)return "";
  const neg=p<0, v=Math.abs(Math.round(p));
  let w=String(Math.floor(v/100)), f=String(v%100).padStart(2,"0");
  if(w.length>3){let head=w.slice(0,-3), tail=w.slice(-3), parts=[];
    while(head.length>2){parts.unshift(head.slice(-2));head=head.slice(0,-2);}
    if(head)parts.unshift(head); w=parts.join(",")+","+tail;}
  return (neg?"−":"")+"₹"+w+"."+f;
}
function compact(p){
  const v=Math.abs(p)/100;
  if(v>=1e7)return (p<0?"−":"")+"₹"+(v/1e7).toFixed(2)+" Cr";
  if(v>=1e5)return (p<0?"−":"")+"₹"+(v/1e5).toFixed(2)+" L";
  return rupees(p);
}
const pct = v => (v===null||v===undefined)?"—":v.toFixed(2)+"%";
const tierClass = t => ({A:"a",B:"b",C:"c"})[t]||"n";
const dt = s => s? String(s).slice(0,10) : "";

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ let d; try{d=await r.json()}catch(e){d={detail:r.statusText}}
    throw new Error(d.detail||("HTTP "+r.status)); }
  return r.json();
}
function toast(msg, ms=3200){ S.toast=msg; render(); setTimeout(()=>{S.toast=null;render()}, ms); }

/* ------------------------------------------------------------------ boot */
async function boot(){
  S.runs = await api("/api/runs");
  if(S.runs.length){ await selectRun(S.runs[0].run_id); }
  await loadAgent();
  await loadTables(false);
  render();
}
async function selectRun(rid){
  S.run = S.runs.find(r=>r.run_id===rid) || null;
  if(!S.run) return;
  S.busy = true; render();
  const [m, st, ex, se] = await Promise.all([
    api(`/api/runs/${rid}/metrics`), api(`/api/runs/${rid}/settlements`),
    api(`/api/runs/${rid}/exceptions`), api(`/api/runs/${rid}/sellers`)]);
  S.metrics=m; S.settlements=st.settlements; S.exceptions=ex.exceptions; S.sellers=se.sellers;
  S.forecast=null;
  try{ S.forecast=await api(`/api/runs/${rid}/forecast?horizon=${S.fc.horizon}`); }catch(e){}
  S.detail=null; S.sid=null; S.busy=false;
  // the conversation belongs to the run, so switching runs switches transcripts
  S.agent.turns=[]; S.agent.error=null;
  try{ S.agent.turns=(await api(`/api/runs/${rid}/conversation`)).turns||[]; }catch(e){}
  // the data browser is scoped to the run, so it follows the run selector
  S.data.page=null; S.data.offset=0;
  await loadTables(false);
  render();
}
async function openSettlement(sid){
  S.busy=true; S.tab="detail"; S.sid=sid; render();
  S.detail = await api(`/api/runs/${S.run.run_id}/settlements/${sid}`);
  S.busy=false; render();
}
async function runTrace(){
  if(!S.traceQ.id) return;
  S.busy=true; render();
  try{ S.trace = await api(`/api/runs/${S.run.run_id}/trace?node_type=${S.traceQ.type}`+
                           `&node_id=${encodeURIComponent(S.traceQ.id)}`); }
  catch(e){ toast(e.message); }
  S.busy=false; render();
}

/* ============================== WATERFALL ==============================
   The one visual that makes the whole problem legible: gross, every policy
   deduction in order, what we expected, what actually arrived, and a final
   bar that is either zero or the exact unexplained rupees.
   ====================================================================== */
function waterfall(steps, height=270){
  const W=Math.max(760, steps.length*104), H=height, padL=54, padR=18, padT=22, padB=64;
  const iw=W-padL-padR, ih=H-padT-padB, bw=Math.min(66, iw/steps.length*0.62);
  // running cumulative for the delta bars
  let run=0; const bars=[];
  for(const s of steps){
    if(s.kind==="base"){ bars.push({...s, from:0, to:s.paise}); run=s.paise; }
    else if(s.kind==="delta"){ bars.push({...s, from:run, to:run+s.paise}); run+=s.paise; }
    else { bars.push({...s, from:0, to:s.paise}); }
  }
  const vals=bars.flatMap(b=>[b.from,b.to]).concat([0]);
  const lo=Math.min(...vals), hi=Math.max(...vals), span=(hi-lo)||1;
  const y=v=>padT+ih-((v-lo)/span)*ih;
  const colour=b=>b.kind==="residual"?(b.paise===0?"var(--em-500)":"var(--red)")
                 :b.kind==="base"?"var(--em-600)"
                 :b.kind==="subtotal"?"var(--em-700)"
                 :b.kind==="actual"?"#0f172a"
                 :(b.paise<0?"#94a3b8":"var(--em-300)");
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width","100%");
  svg.setAttribute("style",`min-width:${W}px;height:${H}px;display:block`);
  const mk=(t,a)=>{const n=document.createElementNS(ns,t);
    for(const[k,v]of Object.entries(a))n.setAttribute(k,v);return n;};
  // gridlines
  for(let i=0;i<=4;i++){
    const v=lo+span*i/4;
    svg.appendChild(mk("line",{x1:padL,x2:W-padR,y1:y(v),y2:y(v),stroke:"#f1f5f9","stroke-width":1}));
    const tx=mk("text",{x:padL-8,y:y(v)+4,"text-anchor":"end","font-size":10,fill:"#94a3b8",
      "font-family":"ui-monospace,monospace"});
    tx.textContent=compact(v); svg.appendChild(tx);
  }
  svg.appendChild(mk("line",{x1:padL,x2:W-padR,y1:y(0),y2:y(0),stroke:"#cbd5e1","stroke-width":1}));
  bars.forEach((b,i)=>{
    const cx=padL+(iw/bars.length)*(i+0.5), x=cx-bw/2;
    const yt=Math.min(y(b.from),y(b.to)), h=Math.max(2.5,Math.abs(y(b.to)-y(b.from)));
    svg.appendChild(mk("rect",{x,y:yt,width:bw,height:h,rx:3,fill:colour(b),
      opacity:b.kind==="delta"?0.92:1}));
    if(i<bars.length-1 && b.kind!=="subtotal" && bars[i+1].kind==="delta"){
      svg.appendChild(mk("line",{x1:x+bw,x2:padL+(iw/bars.length)*(i+1.5)-bw/2,
        y1:y(b.to),y2:y(b.to),stroke:"#cbd5e1","stroke-width":1,"stroke-dasharray":"3 3"}));
    }
    const vt=mk("text",{x:cx,y:yt-6,"text-anchor":"middle","font-size":10.5,
      fill:b.kind==="residual"&&b.paise!==0?"var(--red)":"#334155","font-weight":600,
      "font-family":"ui-monospace,monospace"});
    vt.textContent=compact(b.paise); svg.appendChild(vt);
    const words=b.label.split(" "); let line="", ly=padT+ih+16;
    for(const w of words){
      if((line+" "+w).trim().length>11){ const t=mk("text",{x:cx,y:ly,"text-anchor":"middle",
        "font-size":10.5,fill:"#64748b"}); t.textContent=line; svg.appendChild(t);
        line=w; ly+=12; } else line=(line+" "+w).trim();
    }
    const t=mk("text",{x:cx,y:ly,"text-anchor":"middle","font-size":10.5,fill:"#64748b"});
    t.textContent=line; svg.appendChild(t);
  });
  return svg;
}

function buildWaterfallFromRow(r){
  const steps=[
    {label:"Gross captured", paise:r.gross_amount_paise, kind:"base", policy_derived:false},
    {label:"Refunds", paise:-r.refund_amount_paise, kind:"delta", policy_derived:true},
    {label:"Gateway fees", paise:-r.fee_amount_paise, kind:"delta", policy_derived:true},
    {label:"GST on fees", paise:-r.tax_amount_paise, kind:"delta", policy_derived:true},
    {label:"Adjustments", paise:r.adjustment_amount_paise, kind:"delta", policy_derived:false},
    {label:"Expected net", paise:r.expected_net_paise, kind:"subtotal", policy_derived:true},
    {label:"Actual settled", paise:r.net_settlement_amount_paise, kind:"actual", policy_derived:false},

    {label:"Unexplained residual", paise:r.unexplained_paise, kind:"residual", policy_derived:false}];
  return steps;
}

function traceExamples(){

function traceTree(t){
  const label=(type,id)=>{
    const n=t.nodes[type+":"+id]||{};
    const bits=[];
    if(n.amount_paise!==undefined)bits.push(rupees(n.amount_paise));
    if(n.credit_paise!==undefined)bits.push("+"+rupees(n.credit_paise));
    if(n.gross_allocated_paise!==undefined)
      bits.push(`gross ${rupees(n.gross_allocated_paise)} · commission `+
        `${rupees(n.commission_paise)} · net ${rupees(n.net_seller_paise)}`);
    if(n.refund_amount_paise!==undefined)bits.push("−"+rupees(n.refund_amount_paise));
    if(n.net_settlement_amount_paise!==undefined)bits.push(rupees(n.net_settlement_amount_paise));
    if(n.order_amount_paise!==undefined)bits.push(rupees(n.order_amount_paise));
    if(n.payment_status)bits.push(n.payment_status);
    if(n.payment_method)bits.push(n.payment_method);
    if(n.transfer_status)bits.push(n.transfer_status);
    if(n.refund_status)bits.push(n.refund_status);
    if(n.settlement_status)bits.push(n.settlement_status);
    if(n.settlement_utr)bits.push("UTR "+n.settlement_utr);
    if(n.captured_at)bits.push(dt(n.captured_at));
    if(n.refund_date)bits.push(dt(n.refund_date));
    if(n.transaction_date)bits.push(dt(n.transaction_date));
    if(n.settlement_date)bits.push(dt(n.settlement_date));
    if(n.name)bits.push(n.name);
    return bits.join(" · ");
  };
  const line=(e,dir)=>el("div",{class:"line"},
    el("span",{class:"kind"}, e.edge_kind),
    el("span",{class:"id"}, e.dst_type+" "+e.dst_id),
    el("span",{class:"meta"}, label(e.dst_type, e.dst_id)),
    el("span",{class:"amt"}, e.amount_paise!==null?rupees(e.amount_paise):""));
  const groups={}, dseen=new Set();
  for(const e of t.downstream){
    // A settlement's own POSTED_AS edges fan out to every payment in the batch
    // window. When the story starts at one payment, that is noise -- the
    // payment's own POSTED_AS edges already carry its postings.
    if(t.root.type!=="settlement" && e.src_type==="settlement" && e.edge_kind==="POSTED_AS")
      continue;
    const k=e.depth+"|"+e.dst_type+":"+e.dst_id+"|"+e.edge_kind;
    if(dseen.has(k)) continue; dseen.add(k);
    (groups[e.depth] ||= []).push(e);
  }
  const out=el("div",{});
  if(t.upstream.length){
    const seen=new Set(), uniq=[];
    for(const e of t.upstream){ const k=e.src_type+":"+e.src_id;
      if(!seen.has(k)){seen.add(k);uniq.push(e);} }
    const CAP=20, shown=uniq.slice(0,CAP);
    out.appendChild(el("div",{style:"color:var(--ink-3);margin-bottom:6px"},
      "Upstream — what fed into this ("+uniq.length+" distinct record"+
      (uniq.length===1?"":"s")+")"));
    const u=el("div",{class:"node"});
    for(const e of shown) u.appendChild(el("div",{class:"line"},
      el("span",{class:"kind"},e.edge_kind), el("span",{class:"id"},e.src_type+" "+e.src_id),
      el("span",{class:"meta"},label(e.src_type,e.src_id)),
      el("span",{class:"amt"}, e.amount_paise!==null?rupees(e.amount_paise):"")));
    if(uniq.length>CAP) u.appendChild(el("div",{class:"line"},
      el("span",{class:"meta"},"+ "+(uniq.length-CAP)+" more upstream records — trace a single "+
        "payment for the readable version of this story")));
    out.appendChild(u);
  }
  if(!t.downstream.length){ out.appendChild(el("div",{style:"color:var(--ink-3);margin:12px 0 6px"},
    "Downstream")); out.appendChild(el("div",{class:"node"}, el("div",{class:"line"},
    el("span",{class:"meta"},"Nothing flows out of this record.")))); return out; }
  out.appendChild(el("div",{style:"color:var(--ink-3);margin:12px 0 6px"},
    "Downstream — "+t.root.type+" "+t.root.id+" "+label(t.root.type,t.root.id)));
  Object.keys(groups).sort((a,b)=>a-b).forEach(depth=>{
    const box=el("div",{class:"node",style:`margin-left:${(depth-1)*16}px`});
    // repetitive kinds (ledger postings, mostly) collapse into one summary line
    const byKind={};
    for(const e of groups[depth]) (byKind[e.edge_kind] ||= []).push(e);
    for(const [kind,rows] of Object.entries(byKind)){
      if(rows.length<=4){ for(const e of rows) box.appendChild(line(e)); continue; }
      const total=rows.reduce((a,e)=>a+(e.amount_paise||0),0);
      const d=el("details",{});
      d.appendChild(el("summary",{style:"cursor:pointer;padding-left:14px"},
        el("span",{class:"kind"},kind), " ",
        el("span",{class:"meta"}, rows.length+" "+rows[0].dst_type+" records"),
        el("span",{class:"amt",style:"float:right"}, rupees(total))));
      const inner=el("div",{});
      for(const e of rows.slice(0,60)) inner.appendChild(line(e));
      if(rows.length>60) inner.appendChild(el("div",{class:"line"},
        el("span",{class:"meta"},"+ "+(rows.length-60)+" more")));
      d.appendChild(inner);
      box.appendChild(d);
    }
    out.appendChild(box);
  });
  return out;
}

/* ============================== FORECAST =============================== */
/* Grouped inflow/outflow bars with a running-balance line. One axis: all three
   series are rupees at comparable magnitude, so a second scale would only
   distort the comparison. Emerald = money in, blue = money out; the blue is
   validated against the emerald for colour-vision separation and is deliberately
   NOT the amber or red this app reserves for "needs a human" and "unexplained" —
   an outflow is normal business, not a problem. */
const FC_IN = "#059669", FC_OUT = "#3b6fd4", FC_LINE = "#0f172a";

/* A tick step that lands on 1/2/5 x a power of ten, in paise. */
function niceStep(raw){
  const e=Math.pow(10, Math.floor(Math.log10(Math.max(1,raw))));
  const n=raw/e;
  return (n<=1?1:n<=2?2:n<=5?5:10)*e;
}
/* Axis labels stay terse and uniform — never a full ₹x,xx,xxx.yy on a gridline. */
function axisMoney(p){
  if(!p) return "₹0";
  const sign=p<0?"−":"", v=Math.abs(p)/100;
  const trim=x=>String(Number(x.toFixed(2)));
  if(v>=1e7) return sign+"₹"+trim(v/1e7)+" Cr";
  if(v>=1e5) return sign+"₹"+trim(v/1e5)+" L";
  if(v>=1e3) return sign+"₹"+trim(v/1e3)+" K";
  return sign+"₹"+trim(v);
}
function forecastChart(days, height=250){
  const ns="http://www.w3.org/2000/svg";
  const mk=(t,a)=>{const n=document.createElementNS(ns,t);
    for(const[k,v]of Object.entries(a||{}))n.setAttribute(k,v);return n;};
  const W=Math.max(720, days.length*76), H=height, padL=62, padR=16, padT=18, padB=46;
  const iw=W-padL-padR, ih=H-padT-padB;
  const slot=iw/Math.max(1,days.length), bw=Math.min(15, slot*0.30);

  const vals=days.flatMap(d=>[d.in_paise, -d.out_paise, d.running_paise]).concat([0]);
  // nice round ticks, so the axis reads ₹1 L / ₹50 K / ₹0 and not the raw extremes
  const rawLo=Math.min(0,...vals), rawHi=Math.max(0,...vals);
  const step=niceStep(((rawHi-rawLo)||1)/4);
  const lo=Math.floor(rawLo/step)*step, hi=Math.ceil(rawHi/step)*step;
  const span=(hi-lo)||1;
  const ticks=[]; for(let v=lo; v<=hi+step/2; v+=step) ticks.push(Math.round(v));
  const y=v=>padT+ih-((v-lo)/span)*ih;
  const cx=i=>padL+slot*i+slot/2;

  // 100% so it fills a wide card, min-width so a long horizon SCROLLS in the
  // wrapper's overflow-x instead of squashing every bar into a hairline.
  const svg=mk("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",height:H,
    style:`min-width:${W}px`,
    role:"img","aria-label":"forecast cash flow by working day"});

  // recessive grid, and a real zero line because the balance can go negative
  for(const v of ticks){
    const yy=y(v);
    svg.appendChild(mk("line",{x1:padL,x2:W-padR,y1:yy,y2:yy,
      stroke:v===0?"#cbd5e1":"#f1f5f9","stroke-width":v===0?1.5:1}));
    const t=mk("text",{x:padL-8,y:yy+4,"text-anchor":"end","font-size":10,fill:"#94a3b8"});
    t.textContent=axisMoney(v); svg.appendChild(t);
  }
  const zy=y(0);
  svg.appendChild(mk("line",{x1:padL,x2:W-padR,y1:zy,y2:zy,stroke:"#cbd5e1","stroke-width":1.5}));

  days.forEach((d,i)=>{
    const c=cx(i);
    // 2px gap between the paired bars, ends rounded, both anchored to zero
    const bars=[[d.in_paise, FC_IN, c-bw-1],[d.out_paise, FC_OUT, c+1]];
    for(const [v,fill,x] of bars){
      if(!v) continue;
      const top=y(v), h=Math.max(2, zy-top);
      svg.appendChild(mk("rect",{x, y:top, width:bw, height:h, rx:3, fill}));
    }
    const lab=mk("text",{x:c,y:H-26,"text-anchor":"middle","font-size":10,fill:"#64748b"});
    lab.textContent=d.date.slice(8)+"/"+d.date.slice(5,7); svg.appendChild(lab);
  });

  // running balance, 2px, drawn over the bars with a surface ring at each marker
  const pts=days.map((d,i)=>`${cx(i)},${y(d.running_paise)}`).join(" ");
  svg.appendChild(mk("polyline",{points:pts,fill:"none",stroke:FC_LINE,"stroke-width":2,
    "stroke-linejoin":"round","stroke-linecap":"round"}));
  days.forEach((d,i)=>{
    svg.appendChild(mk("circle",{cx:cx(i),cy:y(d.running_paise),r:3.5,fill:FC_LINE,
      stroke:"#fff","stroke-width":2}));
  });
  // label only the ends, never every point
  [[0,"start"],[days.length-1,"end"]].forEach(([i,anchor])=>{
    if(days[i]===undefined) return;
    const t=mk("text",{x:cx(i),y:y(days[i].running_paise)-11,"text-anchor":"middle",
      "font-size":10.5,"font-weight":650,fill:FC_LINE});
    t.textContent=compact(days[i].running_paise); svg.appendChild(t);
  });

  // per-day hover: a full-height hit target, wider than the marks
  days.forEach((d,i)=>{
    const hit=mk("rect",{x:padL+slot*i,y:padT,width:slot,height:ih,fill:"transparent"});
    hit.style.cursor="crosshair";
    const title=mk("title",{});
    title.textContent=`${d.date}\nin  ${rupees(d.in_paise)}\nout ${rupees(d.out_paise)}\n`+
                      `net ${rupees(d.net_paise)}\nbalance ${rupees(d.running_paise)}`;
    hit.appendChild(title); svg.appendChild(hit);
  });
  return svg;
}

function fcLegend(){
  const key=(c,label)=>el("span",{style:"display:inline-flex;align-items:center;gap:6px"},
    el("span",{style:`width:10px;height:10px;border-radius:3px;background:${c};`+
      "display:inline-block"}), el("span",{style:"color:var(--ink-3);font-size:12px"},label));
  return el("div",{style:"display:flex;gap:16px;align-items:center;padding:0 16px 10px"},
    key(FC_IN,"Money in"), key(FC_OUT,"Money out"),
    el("span",{style:"display:inline-flex;align-items:center;gap:6px"},
      el("span",{style:`width:14px;height:2px;background:${FC_LINE};display:inline-block`}),
      el("span",{style:"color:var(--ink-3);font-size:12px"},"Running balance")));
}

/* ========================== CASH POSITION PAGE ========================= */
/* The forward view. Everything here is *derived*: no model, no trend, no
   forecast of future sales — only money already owed under the policy, dated by
   the working-day calendar. Every row names the record it came from and the
   policy rule that dated it, so a controller can go and check it. */

async function reloadForecast(h){
  if(!S.run) return;
  S.fc.horizon=h; S.fc.busy=true; render();
  try{ S.forecast=await api(`/api/runs/${S.run.run_id}/forecast?horizon=${h}`); }
  catch(e){ toast(e.message); }
  S.fc.busy=false; render();
}

const HORIZONS=[10,15,30,60];

function fcStat(k,v,d,cls){
  return el("div",{class:"stat "+(cls||"")},
    el("div",{class:"k"},k), el("div",{class:"v"},v), d&&el("div",{class:"d"},d));
}

/* One table, built from a column spec. Keeps the four tables below identical in
   behaviour so a reader learns the shape once. */
function fcTable(cols, rows, empty){
  if(!rows.length) return el("div",{class:"empty"}, empty);
  return el("div",{class:"tablewrap"}, el("table",{},
    el("thead",{}, el("tr",{}, ...cols.map(c=>
      el("th",{style:c.num?"text-align:right":""}, c.h)))),
    el("tbody",{}, ...rows.map(r=>
      el("tr",{}, ...cols.map(c=>
        el("td",{class:(c.num?"num ":"")+(c.cls||"")}, c.f(r))))))));
}

/* Days until, phrased so the number and its unit never separate. */
function wd(n){
  if(n===null||n===undefined) return "—";
  return n===0 ? "today" : n===1 ? "1 working day" : `${n} working days`;
}

function viewCash(){
  const f=S.forecast;
  if(!f) return el("div",{class:"empty"},
    "No forecast for this run. Run reconciliation first.");
  const t=f.totals;
  const lines=f.lines||[];
  const pipeline = lines.filter(l=>l.bucket==="pipeline");
  const awaited  = lines.filter(l=>l.bucket==="settlement_awaited");
  const payouts  = lines.filter(l=>l.bucket==="seller_payout");

  const horizonPicker = el("span",{style:"display:flex;gap:6px;align-items:center"},
    el("span",{style:"font-size:12px;color:var(--ink-3)"},"Horizon"),
    ...HORIZONS.map(h=>el("button",{class:"btn"+(S.fc.horizon===h?" on":""),
      style:"padding:4px 9px;font-size:12px",
      onclick:()=>reloadForecast(h)}, h+" wd")));

  /* --------------------------------------------------- headline + chart -- */
  const head = el("div",{class:"card"},
    el("h3",{},"Cash position",
      el("span",{class:"sub"},`as of ${f.as_of} · next ${f.horizon_working_days} working days`),
      el("span",{class:"spacer",style:"flex:1"}),
      S.fc.busy ? el("span",{class:"spin"}) : null,
      horizonPicker),
    el("div",{class:"grid",style:"grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px 12px"},
      fcStat("Expected in", rupees(t.inflow_paise),
        `${awaited.length} awaited credits · ${pipeline.length} in the pipeline`),
      fcStat("Expected out", rupees(t.outflow_paise), `${payouts.length} seller payouts due`),
      fcStat("Net", rupees(t.net_paise), "over the window",
        t.net_paise<0?"bad":""),
      fcStat("Overdue", rupees(t.overdue_paise + t.overdue_payout_paise),
        `${t.overdue_count} credits · ${t.overdue_payout_count} payouts`,
        (t.overdue_paise+t.overdue_payout_paise)?"bad":"")),
    fcLegend(),
    el("div",{class:"body",style:"overflow-x:auto;padding-top:0"},
      f.days && f.days.length ? forecastChart(f.days)
        : el("div",{class:"empty"},"Nothing scheduled in this window.")));

  /* ------------------------------------- 1. captured, awaiting settlement -- */
  /* The question this page exists to answer: what has the merchant already
     taken that has not reached the bank yet, and when does each rupee land. */
  const pipeCard = el("div",{class:"card"},
    el("h3",{},"Captured, not yet settled",
      el("span",{class:"sub"},
        `${pipeline.length} payments · ${rupees(t.pipeline_paise)} net expected`),
      el("span",{class:"spacer",style:"flex:1"}),
      el("span",{class:"chip"},"projected")),
    fcTable([
      {h:"Payment", f:r=>el("span",{class:"tag mono"},r.subject_id)},
      {h:"Method",  f:r=>el("span",{class:"chip"},r.detail.method||"—")},
      {h:"Captured", f:r=>r.detail.capture_date},
      {h:"Settles", f:r=>r.detail.settles_on,
        cls:"", },
      {h:"Cash lands", f:r=>el("b",{},r.date)},
      {h:"In", f:r=>wd(r.detail.working_days_until_credit)},
      {h:"Gross", num:true, f:r=>rupees(r.detail.gross_paise)},
      // UPI is zero-rated in the policy registry; a row of "−Rs 0.00" is noise
      {h:"Fee + GST", num:true, f:r=>el("span",{style:"color:var(--ink-3)"},
        r.detail.fee_paise ? "−"+rupees(r.detail.fee_paise) : "—")},
      {h:"Net expected", num:true, f:r=>el("b",{},rupees(r.amount_paise))},
    ], pipeline,
      "Nothing captured and unsettled inside this window. Widen the horizon, or "+
      "the book has no trading after the last settlement period."),
    el("div",{class:"body",style:"border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3)"},
      "Settles at T+", (pipeline[0]&&pipeline[0].detail.cycle_working_days)||"n",
      " working days from capture, then the bank lag and tolerance. Net is after ",
      "the gateway fee and GST computed from the policy registry — the gross never ",
      "reaches the bank, so showing it as expected cash would overstate the position. ",
      "UPI carries no MDR under this policy, so those rows show no fee."));

  /* ------------------------------------- 2. settled, awaiting bank credit -- */
  const awaitedCard = el("div",{class:"card"},
    el("h3",{},"Settled, awaiting bank credit",
      el("span",{class:"sub"},
        `${awaited.length} settlements · ${rupees(t.settlement_awaited_paise)}`),
      el("span",{class:"spacer",style:"flex:1"}),
      el("span",{class:"chip"},"awaited")),
    fcTable([
      {h:"Settlement", f:r=>el("button",{class:"btn",style:"padding:2px 8px;font-size:12px",
        onclick:()=>openSettlement(r.subject_id)}, r.subject_id)},
      {h:"Settled on", f:r=>r.detail.settlement_date},
      {h:"Credit due", f:r=>el("b",{},r.date)},
      {h:"In", f:r=>wd(r.detail.working_days_until_due)},
      {h:"Rule", f:r=>el("span",{class:"mono",style:"font-size:11px"},r.rule)},
      {h:"Amount", num:true, f:r=>el("b",{},rupees(r.amount_paise))},
    ], awaited,
      "Every settlement in this window has been matched to a bank credit."),
    el("div",{class:"body",style:"border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3)"},
      "These are the settlements the Δ₂ matcher could not match to a bank line — ",
      "read from its verdict, not re-derived. A settlement matched on evidence ",
      "other than the UTR has already landed and is deliberately absent here."));

  /* ------------------------------------------------ 3. money going out ---- */
  const payoutCard = el("div",{class:"card"},
    el("h3",{},"Seller payouts due",
      el("span",{class:"sub"},
        `${payouts.length} allocations · ${rupees(t.seller_payout_paise)}`)),
    fcTable([
      {h:"Allocation", f:r=>el("span",{class:"tag mono"},r.subject_id)},
      {h:"Seller", f:r=>r.detail.seller_name||r.detail.seller_id},
      {h:"Funded by capture", f:r=>r.detail.capture_date},
      {h:"Due", f:r=>el("b",{},r.date)},
      {h:"Status", f:r=>el("span",{class:"chip"},r.state)},
      {h:"Amount", num:true, f:r=>el("b",{},rupees(r.amount_paise))},
    ], payouts, "No seller payouts fall due in this window."));

  /* ------------------------------------------------------- 4. overdue ---- */
  const od=f.overdue||[], odp=f.overdue_payouts||[];
  const overdueCard = (od.length||odp.length) ? el("div",{class:"card"},
    el("h3",{},"Already overdue",
      el("span",{class:"sub"},"past its due date — owed now, not scheduled"),
      el("span",{class:"spacer",style:"flex:1"}),
      el("span",{class:"chip c"}, rupees(t.overdue_paise+t.overdue_payout_paise))),
    od.length ? el("div",{},
      el("div",{class:"body",style:"padding-bottom:6px;font-size:12px;font-weight:600;color:var(--ink-3)"},
        `BANK CREDITS — ${od.length}, ${rupees(t.overdue_paise)}`),
      fcTable([
        {h:"Settlement", f:r=>el("button",{class:"btn",style:"padding:2px 8px;font-size:12px",
          onclick:()=>openSettlement(r.settlement_id)}, r.settlement_id)},
        {h:"Settled on", f:r=>r.settlement_date},
        {h:"Was due", f:r=>r.due_date},
        {h:"Overdue by", f:r=>el("span",{class:"chip c"}, wd(r.working_days_overdue))},
        {h:"Amount", num:true, f:r=>el("b",{},rupees(r.amount_paise))},
      ], od, "")) : null,
    odp.length ? el("div",{},
      el("div",{class:"body",style:"padding-bottom:6px;font-size:12px;font-weight:600;color:var(--ink-3)"},
        `SELLER PAYOUTS — ${t.overdue_payout_count}, ${rupees(t.overdue_payout_paise)}`+
        (odp.length<t.overdue_payout_count?` (largest ${odp.length} shown)`:"")),
      fcTable([
        {h:"Allocation", f:r=>el("span",{class:"tag mono"},r.allocation_id)},
        {h:"Seller", f:r=>r.seller_name||r.seller_id},
        {h:"Was due", f:r=>r.due_date},
        {h:"Overdue by", f:r=>el("span",{class:"chip c"}, wd(r.working_days_overdue))},
        {h:"Amount", num:true, f:r=>el("b",{},rupees(r.amount_paise))},
      ], odp, "")) : null) : null;

  /* --------------------------------------------------- how it was dated -- */
  const basis = el("div",{class:"card"},
    el("h3",{},"How these dates were derived"),
    el("div",{class:"body"},
      el("ul",{style:"margin:0;padding-left:18px;font-size:13px;line-height:1.65;color:var(--ink-2)"},
        ...(f.assumptions||[]).map(a=>el("li",{},a))),
      el("div",{style:"margin-top:12px;font-size:12.5px;color:var(--ink-3)"},
        "Derived, not predicted. There is no model and no trend here — this is ",
        "money already owed under the policy, dated by the calendar the engine ",
        "reconciles against. It contains no forecast of future sales.")));

  return el("div",{class:"grid",style:"gap:18px"},
    head, pipeCard, awaitedCard, payoutCard, overdueCard, basis);
}

/* ============================ DATA BROWSER ============================= */
/* Every table in the schema, scoped to the run you are looking at, with live
   row counts. Read-only: there is no write path from this tab, and the table
   name is validated against the database catalogue server-side before it ever
   reaches a query. */
async function loadTables(keepSelection){
  if(!S.run) return;
  try{
    const r = await api(`/api/runs/${S.run.run_id}/tables`);
    S.data.tables = r.tables || [];
  }catch(e){ S.data.tables = []; }
  if(keepSelection && S.data.table) await openTable(S.data.table, S.data.offset, true);
}
async function openTable(name, offset, quiet){
  S.data.table = name; S.data.offset = Math.max(0, offset||0);
  if(!quiet){ S.data.busy = true; render(); }
  try{
    S.data.page = await api(
      `/api/runs/${S.run.run_id}/tables/${name}?limit=50&offset=${S.data.offset}`);
  }catch(e){ S.data.page = {table:name, rows:[], columns:[], total_rows:0, error:e.message}; }
  S.data.busy = false; render();
}
function cellText(v, col, raw){
  if(v===null || v===undefined) return el("span",{class:"db-null"},"null");
  if(col.money && !raw && typeof v === "number") return rupees(v);
  if(typeof v === "object") return JSON.stringify(v);
  return String(v);
}
function viewData(){
  const d = S.data;
  const groups = [["data","Generated data"],["results","Engine results"]];
  const list = el("div",{class:"db-list"});
  for(const [key,label] of groups){
    const rows = d.tables.filter(t=>t.group===key);
    if(!rows.length) continue;
    list.appendChild(el("div",{class:"db-group"},label));
    for(const t of rows){
      list.appendChild(el("div",{
        class:"db-item"+(d.table===t.table?" on":"")+(t.rows?"":" zero"),
        title:`scoped by ${t.scope} · ${t.columns} columns`,
        onclick:()=>openTable(t.table,0)},
        el("span",{},t.table), el("span",{class:"n"},t.rows.toLocaleString())));
    }
  }

  let right;
  if(d.busy){
    right = el("div",{class:"empty"},el("span",{class:"spin"})," loading rows…");
  } else if(!d.page){
    right = el("div",{class:"ask-note"},
      el("p",{},"Select a table to view its rows for this run."));
  } else if(d.page.error){
    right = el("div",{class:"ask-warn"}, d.page.error);
  } else {
    const p = d.page;
    const from = p.total_rows ? p.offset+1 : 0, to = Math.min(p.offset+p.limit, p.total_rows);
    right = el("div",{},
      el("div",{class:"db-head"},
        el("h4",{},p.table),
        el("span",{class:"meta"},
          `${p.total_rows.toLocaleString()} rows · ${p.columns.length} columns · scoped by ${p.scope}`),
        el("span",{class:"spacer",style:"flex:1"}),
        el("label",{class:"db-toggle"},
          el("input",{type:"checkbox", ...(d.raw?{checked:"checked"}:{}),
            onchange:e=>{d.raw=e.target.checked; render();}}),
          "raw paise")),
      el("div",{class:"db-scroll"},
        el("table",{},
          el("thead",{},el("tr",{},...p.columns.map(c=>
            el("th",{class:c.money?"num":"",title:c.type},c.name)))),
          el("tbody",{},...p.rows.map(r=>el("tr",{class:"zebra"},
            ...p.columns.map(c=>el("td",{class:c.money?"num":""},
              cellText(r[c.name], c, d.raw)))))))),
      el("div",{class:"db-pager"},
        el("button",{class:"btn", disabled:p.offset?null:"disabled",
          onclick:()=>openTable(p.table, Math.max(0,p.offset-p.limit))},"← Previous"),
        el("button",{class:"btn", disabled:(p.offset+p.limit<p.total_rows)?null:"disabled",
          onclick:()=>openTable(p.table, p.offset+p.limit)},"Next →"),
        el("span",{}, p.total_rows ? `showing ${from}–${to} of ${p.total_rows.toLocaleString()}`
                                   : "no rows for this run yet")));
  }

  return el("div",{class:"card"},
    el("h3",{},"Data",
      el("span",{class:"sub"},"read-only"),
      el("button",{class:"btn",style:"float:right",
        onclick:()=>loadTables(true).then(render)},"Refresh")),
    el("div",{class:"db-wrap"}, list, right));
}

/* ============================ AGENT PANEL ============================== */
/* The agent reads persisted results and explains them. It never recomputes a
   figure and cannot change one, so this panel is deliberately read-only: the
   numbers on every other tab are unaffected by anything said here. */
async function loadAgent(){
  try{ S.agent.status = await api("/api/agent/status"); }
  catch(e){ S.agent.status = {configured:false, label:"the model provider", error:e.message}; }
  if(S.run){
    try{ S.agent.turns = (await api(`/api/runs/${S.run.run_id}/conversation`)).turns || []; }
    catch(e){ S.agent.turns = []; }
  }
}
async function askAgent(q){
  q = (q||"").trim();
  if(!q || S.agent.asking) return;
  S.agent.asking = true; S.agent.error = null; S.agent.draft = ""; render();
  try{
    const r = await api(`/api/runs/${S.run.run_id}/ask`, {method:"POST",
      headers:{"content-type":"application/json"}, body:JSON.stringify({question:q})});
    S.agent.turns.push({turn_id:r.turn_id, question:q, answer:r.answer,
      tool_calls:r.tool_calls, tool_call_count:r.tool_call_count, citations:r.citations,
      unsupported_references:r.unsupported_references, grounded:r.grounded,
      model:r.model, provider:r.provider, elapsed_seconds:r.elapsed_seconds,
      stop_reason:r.stop_reason});
  }catch(e){ S.agent.error = e.message; }
  S.agent.asking = false; render();
  const sc=$(".ask-scroll"); if(sc) sc.scrollTop = sc.scrollHeight;
}
function jumpToCitation(id){
  const sid=(id.match(/^(SET_\d+)/)||[])[1];
  if(sid){ openSettlement(sid); return; }
  if(/^(P|R|A|T|O|B|L)_\d+$/.test(id)){
    const kind={P:"payment",R:"refund",A:"seller_allocation",T:"transfer",O:"order",
                B:"bank_transaction",L:"ledger_entry"}[id[0]];
    S.traceQ={type:kind,id}; S.tab="trace"; runTrace(); return;
  }
  S.tab="exceptions"; S.filters.q=id; render();
}
function paragraphs(text){
  return String(text||"").split(/\n{2,}/).filter(Boolean)
    .map(t=>el("p",{},t.replace(/\n/g," ")));
}
function viewAsk(){
  const st=S.agent.status||{};
  const body=el("div",{class:"ask-wrap"});
  const scroll=el("div",{class:"ask-scroll"});

  if(!st.configured){
    scroll.appendChild(el("div",{class:"ask-note"},
      el("p",{},el("b",{},"The investigation agent is not configured.")),
      el("p",{},`Set an API key for ${st.label||"a provider"} and restart the API:`),
      el("pre",{class:"mono",style:"background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto"},
        (st.expected_env||["GEMINI_API_KEY"]).map(k=>`export ${k}=…`).join("\n")+
        "\n./run.sh serve"),
      el("p",{},"The rest of the application is unaffected.")));
  } else if(!S.agent.turns.length && !S.agent.asking){
    scroll.appendChild(el("div",{class:"ask-note"},
      el("div",{class:"ask-seed"}, ...(st.suggested_questions||[]).map(q=>
        el("button",{onclick:()=>askAgent(q)}, q)))));
  }

  for(const t of S.agent.turns){
    const turn=el("div",{class:"ask-turn"},
      el("div",{class:"ask-q"}, el("div",{class:"who"},"You"), el("div",{class:"txt"},t.question)),
      el("div",{class:"ask-a"}, el("div",{class:"who"},"₹"),
        el("div",{class:"body"}, ...paragraphs(t.answer),
          (t.unsupported_references||[]).length
            ? el("div",{class:"ask-warn"},
                el("b",{},"Unverified: "), t.unsupported_references.join(", "),
                " — not present in any record the agent read.")
            : null,
          el("div",{class:"ask-meta"},
            ...(t.citations||[]).slice(0,12).map(c=>
              el("button",{class:"ask-cite",title:"open this record",
                onclick:()=>jumpToCitation(c)}, c)),
            ...(t.tool_calls||[]).map(c=>el("span",{class:"ask-tool"}, c.tool)),
            el("span",{class:"ask-tool"},
              `${t.model||"model"} · ${t.elapsed_seconds ?? "?"}s`)))));
    scroll.appendChild(turn);
  }
  if(S.agent.asking){
    scroll.appendChild(el("div",{class:"ask-a"}, el("div",{class:"who"},"₹"),
      el("div",{class:"body",style:"color:var(--ink-3)"},
        el("span",{class:"spin"}), " reading the run…")));
  }
  if(S.agent.error){
    scroll.appendChild(el("div",{class:"ask-warn"}, S.agent.error));
  }
  body.appendChild(scroll);

  const input=el("input",{type:"text",placeholder:
    st.configured ? "Ask about a settlement, an exception, a seller…"
                  : "Set an API key to enable the agent",
    value:S.agent.draft, disabled:st.configured?null:"disabled",
    oninput:e=>{S.agent.draft=e.target.value;},
    onkeydown:e=>{if(e.key==="Enter"){e.preventDefault();askAgent(e.target.value);}}});
  body.appendChild(el("form",{class:"ask-form",onsubmit:e=>{e.preventDefault();askAgent(input.value);}},
    input,
    el("button",{class:"btn primary",type:"submit",
      disabled:(st.configured && !S.agent.asking)?null:"disabled"},
      S.agent.asking?"Reading…":"Ask")));
  return el("div",{class:"card"},
    el("h3",{},"Ask the agent",
      el("span",{class:"sub"},"read-only")),
    body);
}

/* ================================ RENDER =============================== */
const TABS=[["dashboard","Dashboard"],["settlements","Settlements"],["detail","Settlement detail"],
  ["exceptions","Exceptions"],["cash","Cash position"],["sellers","Seller payouts"],
  ["trace","Trace money"],["data","Data"],["ask","Ask the agent"]];
function render(){
  const nav=$("#tabs"); nav.innerHTML="";
  for(const [k,label] of TABS){
    if(k==="detail" && !S.detail && !S.sid) continue;
    nav.appendChild(el("button",{class:S.tab===k?"on":"",onclick:()=>{S.tab=k;render()}},label));
  }
  const sel_=$("#runsel"); sel_.innerHTML="";
  for(const r of S.runs){
    const o=el("option",{value:r.run_id},
      `${r.label||"run"} · ${String(r.started_at).slice(0,19).replace("T"," ")} · ${r.run_id.slice(0,8)}`);
    if(S.run && r.run_id===S.run.run_id)o.selected=true;
    sel_.appendChild(o);
  }
  const app=$("#app"); app.innerHTML="";
  if(!S.run){ app.appendChild(el("div",{class:"empty"},
    "No runs yet. Generate a dataset, then run reconciliation.")); }
  else if(S.busy && !S.detail && S.tab==="detail"){
    app.appendChild(el("div",{class:"empty"},el("span",{class:"spin"})," loading settlement…"));
  } else {
    const v={dashboard:viewDashboard,settlements:viewSettlements,detail:viewDetail,
      exceptions:viewExceptions,sellers:viewSellers,trace:viewTrace,ask:viewAsk,
      data:viewData,cash:viewCash}[S.tab];
    app.appendChild(v());
  }
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  if(S.toast) document.body.appendChild(el("div",{class:"toast"},S.toast));
}

/* ---------------------------------------------------------------- events */
$("#runsel").addEventListener("change", e=>selectRun(e.target.value));
$("#btn-generate").addEventListener("click", async ()=>{
  const b=$("#btn-generate"); b.disabled=true; b.textContent="Generating…";
  try{
    const seed=Number(prompt("Seed (the dataset is byte-identical for a given seed):","42")||42);
    const r=await api("/api/datasets",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({seed, settlements:100, label:"demo"})});
    window.__lastDataset=r.dataset_id;

    // The dataset_id is derived from the seed, so generating REPLACES the dataset
    // for that seed -- and datasets cascade, so every run against it is deleted
    // too. If the UI stayed on the old run_id, every subsequent call (metrics,
    // conversation, ask, tables) would 404 against a run that no longer exists.
    // Reconcile immediately and move the UI onto the new run, the way the tick
    // and evaluation-batch buttons already do.
    b.textContent="Reconciling…";
    const m=await api("/api/runs",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({dataset_id:r.dataset_id})});
    S.runs=await api("/api/runs");
    await selectRun(m.run_id);
    S.tab="dashboard";
    await loadTables(false);
    toast(`Dataset ${r.dataset_id.slice(0,8)} · `+
      `${r.row_counts.total_financial_records.toLocaleString()} records · `+
      `${r.planted_anomalies} planted · reconciled in ${m.throughput.elapsed_seconds}s · `+
      `${m.accuracy.amount_at_risk_display} at risk`);
  }catch(e){toast(e.message)}
  b.disabled=false; b.textContent="Generate dataset";
});
$("#btn-tick").addEventListener("click", async ()=>{
  const b=$("#btn-tick"); b.disabled=true; b.textContent="Simulating…";
  try{
    const ds=await api("/api/datasets");
    const target=(S.run&&S.run.dataset_id) || window.__lastDataset || (ds[0]&&ds[0].dataset_id);
    if(!target){toast("Generate a dataset first.");}
    else{
      const r=await api(`/api/datasets/${target}/tick`,{method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({settlements:10, clean:false, reconcile:true})});
      window.__lastDataset=target;
      S.runs=await api("/api/runs");
      const wasOnData = S.tab==="data";
      if(r.run){ await selectRun(r.run.run_id); S.tab = wasOnData ? "data" : "dashboard"; }
      await loadTables(true);
      const bits=[`Cycle ${r.batch} · ${r.appended.settlements} new settlements`,
                  `${r.appended.total_financial_records.toLocaleString()} records`,
                  `${r.appended.ground_truth_anomalies} planted`];
      if(r.late_refunds) bits.push(`${r.late_refunds} late refunds on closed settlements`);
      if(r.bank_credits_resolved) bits.push(`${r.bank_credits_resolved} in-flight credit landed`);
      toast(bits.join(" · "));
    }
  }catch(e){toast(e.message)}
  b.disabled=false; b.textContent="Simulate next cycle";
});
$("#btn-fixture").addEventListener("click", async ()=>{
  const b=$("#btn-fixture"); b.disabled=true; b.textContent="Loading…";
  try{
    const r=await api("/api/fixtures/evaluation-batch",{method:"POST",
      headers:{"content-type":"application/json"}, body:"{}"});
    window.__lastDataset=r.dataset_id;
    S.runs=await api("/api/runs");
    if(r.run){ await selectRun(r.run.run_id); S.tab="dashboard"; }
    await loadTables(true);
    const g=(r.run&&r.run.ground_truth)||{};
    toast(`Evaluation batch · ${r.row_counts.scenarios} scenarios · `+
      `${r.row_counts.total_financial_records.toLocaleString()} records · `+
      `detection ${g.resolvable_detection_rate_pct ?? "?"}% · `+
      `traps ${g.false_positive_traps_avoided ?? 0}/${g.false_positive_traps ?? 0} · `+
      `${g.false_auto_resolution_count ?? 0} false auto-resolutions`);
  }catch(e){toast(e.message)}
  b.disabled=false; b.textContent="Evaluation batch";
});
$("#btn-run").addEventListener("click", async ()=>{
  const b=$("#btn-run"); b.disabled=true; b.textContent="Reconciling…";
  try{
    const ds=await api("/api/datasets");
    const target=window.__lastDataset || (ds[0]&&ds[0].dataset_id);
    if(!target){toast("Generate a dataset first.");}
    else{
      const m=await api("/api/runs",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({dataset_id:target})});
      S.runs=await api("/api/runs");
      await selectRun(m.run_id);
      S.tab="dashboard";
      toast(`Reconciled in ${m.throughput.elapsed_seconds}s · `+
        `${m.accuracy.amount_at_risk_display} at risk`);
    }
  }catch(e){toast(e.message)}
  b.disabled=false; b.textContent="Run reconciliation";
});
boot().catch(e=>{ $("#app").innerHTML=""; $("#app").appendChild(
  el("div",{class:"empty"},"Could not reach the API: "+e.message)); });
</script>
</body>
</html>
